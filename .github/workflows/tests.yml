name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install project and Chromium
        run: |
          python -m pip install -e '.[browser,dev]'
          python -m playwright install --with-deps chromium
      - name: Run offline unit and real-browser tests
        run: python -m pytest -o addopts='' -q
